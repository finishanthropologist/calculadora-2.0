<div class="container w-50 mx-auto mt-5">
    <form (submit)="$event.preventDefault(); enviarResultado(numero1.value, numero2.value)">
        <div class="mb-3">
            <label for="numero1" class="form-label">Número 1:</label>
            <input type="number" id="numero1" #numero1 name="numero1" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="numero2" class="form-label">Número 2:</label>
            <input type="number" id="numero2" #numero2 name="numero2" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Calcular</button>
    </form>
</div>
